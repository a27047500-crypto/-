name: Build & Release Windows Installer

on:
  push:
    tags:
      - 'v*'          # 推送 v1.0.0、v2.1.3 等 tag 时触发

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer (output → dist/)
        run: npm run build:win:ci

      - name: Upload installer to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "流程文件编辑器 ${{ github.ref_name }}"
          body: |
            ## 流程文件编辑器 ${{ github.ref_name }}

            ### 下载安装
            1. 点击下方 **流程文件编辑器-Setup-*.exe** 下载安装版（推荐）
            2. 或下载 **流程文件编辑器-*.exe** 便携版（免安装，直接运行）

            ### 安装步骤（安装版）
            1. 双击 Setup.exe，按向导完成安装
            2. 桌面/开始菜单会自动创建快捷方式

            ### 更新内容
            - 节标题支持删除，编号自动重排
            - 功能区紧凑优化，减少空白区域
            - 浮动工具栏 Apple 风格全面升级
          files: dist/**/*.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
